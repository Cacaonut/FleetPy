# 1 - FleetSimulation
sim_env: RealtimeV2Simulation
op_realtime_speed_factor: 1
op_realtime_request_timeout: 45
log_level: info
network_type: NetworkTTMatrix
network_name: Manhattan_2019_corrected
nw_dynamic_f: 2018-11-12_mean_tt_factor_hourly.csv
demand_name: Manhattan_2018
random_seed: 0
start_time: 0
end_time: 720
time_step: 10
user_max_decision_time: 60
route_output_flag: True
replay_flag: True
nr_mod_operators: 1
rq_type: BasicRequest

# 2 - FleetControl (Batch-Based Optimization)
op_module: RidePoolingBatchAssignmentFleetcontrol
op_rp_batch_optimizer: AlonsoMora
op_min_wait_time: 0
op_max_wait_time: 300
op_max_detour_time_factor: 40
op_const_boarding_time: 30
op_add_boarding_time: 0
op_base_fare: 0
op_distance_fare: 0.1
op_time_fare: 0
op_min_standard_fare: 100
op_reoptimisation_timestep: 30
### AlonsoMora batch optimizer heuristics
#op_treebuild_timeout_per_veh: 1
op_max_tours_per_v2rb: 4
op_optimisation_timeout: 20
#op_applied_heuristic: after_opt_rv_best_v2rb
#op_max_VR_con: 10
op_vr_control_func_dict: {func_key: distance_and_user_times_man, vot: 0.45833, dc: 0.0694}
### Repositioning & Zone System
op_zone_system: Manhattan_Taxi_Zones
op_repo_method: AlonsoMoraRepositioning
op_repo_timestep: 300
op_repo_horizons: [0, 2700]
op_repo_lock: False
